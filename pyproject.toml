[project]
name = "reflecto_exp"
version = "0.1.1"
description = "Machine learning tools for X-ray reflectivity analysis"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Isaac Yong", email = "isaacyong@naver.com"}
]

license = { text = "MIT" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "matplotlib",
    "PyYAML",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "h5py",
    "ipykernel",
    "pydantic",
    "loguru",
    "torch",
    "torchvision",
    "torchaudio",
    "hydra-core",
    "seaborn",
    "genx3",
    "bumps>=1.0.3",
    "optuna>=4.6.0",
    "cycler>=0.12.1",
]

[project.optional-dependencies]
colab = [
    # 코랩 환경에 이미 설치되어 있는 패키지들은 버전 충돌을 피하기 위해
    # 여기서 생략하거나 최소 버전만 명시하여 속도를 올립니다.
    "genx3",
    "bumps>=1.0.3",
    "optuna>=4.6.0",
    "hydra-core",
    "loguru",
]
dev = [
    "black>=22.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=0.18.0",
]

# cu128: Blackwell(sm_120, RTX 50 시리즈) 지원. cu126 빌드는 sm_90까지만 지원하여
# RTX 5070에서 "no kernel image is available for execution on the device"로 실패함.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 150
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", ".eggs", "build", "dist"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # PEP8 errors
    "W",   # PEP8 warnings
    "F",   # Pyflakes
    "I",   # Import Order
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["reflectolearn"]
combine-as-imports = true

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]